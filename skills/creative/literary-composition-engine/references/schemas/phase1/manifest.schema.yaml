schema_contract:
  artifact: "runs/<author>/<run_id>/manifest.json"
  phase: "phase_1_corpus_preparation"
  purpose: >
    Record which works were discovered in the raw source files and which story
    extraction tasks must be created.
  required_top_level:
    - "author"
    - "source_files"
    - "works"
    - "excluded_material"
    - "risks"
  schema:
    author: ""
    source_files:
      - ""
    works:
      - story_id: ""
        title: ""
        collection: null
        pub_year: null
        source_file: ""
        order: null
        status: "pending"
        reason: ""
    excluded_material:
      - label: ""
        reason: ""
    risks:
      - ""
  allowed_values:
    works.status:
      - "pending"
      - "needs_review"
  must_not:
    - "Do not mark a story done; discovery only creates extraction tasks."
    - "Do not invent publication metadata if the source does not provide it."
    - "Do not add confidence or probability fields."
