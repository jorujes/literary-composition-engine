schema_contract:
  artifact: "runs/<author>/<run_id>/paragraphs/<pid>/sentence_anchor.final_audit.yaml"
  phase: "phase_4_writing_runtime"
  purpose: "Independently classify each target/source sentence pair by real rhetorical fit."
  required_top_level:
    - "sentence_anchor_final_audit"
  schema:
    sentence_anchor_final_audit:
      run_id: ""
      paragraph_id: ""
      audited_candidate_ref: "candidate.output.yaml"
      overall_status: "passed | blocked"
      repair_required: false
      sentence_results:
        - sentence_id: ""
          target_sentence: ""
          selected_source_sentence_ref: {}
          selected_source_sentence_text: ""
          target_rhetorical_operation: ""
          source_rhetorical_operation: ""
          operation_match: "exact | close | partial | no"
          narrative_action_match: "exact | close | loose | mismatch"
          entity_action_role_match: "exact | close | loose | mismatch"
          why_action_match_is_not_loose_analogy: ""
          prewriting_form_match_status: "strong_form_match | acceptable_form_match | weak_form_match | failed_form_match | missing"
          formal_match_checks:
            mood_match: "'yes' | acceptable_difference | 'no'"
            clause_sequence_match: "'yes' | acceptable_difference | 'no'"
            coordination_subordination_match: "'yes' | acceptable_difference | 'no'"
            turn_logic_match: "'yes' | acceptable_difference | 'no'"
            punctuation_function_match: "'yes' | acceptable_difference | 'no'"
            category_fit: "'yes' | acceptable_difference | 'no'"
            acceptable_differences_from_matching:
              - ""
          initial_anchor_status: "strong_anchor | acceptable_anchor | weak_anchor | failed_anchor"
          final_anchor_status: "strong_anchor | acceptable_anchor | weak_anchor | failed_anchor"
          semantic_copy_check:
            finding: "clean | possible_copy | failed"
            explanation: ""
          why_status: ""
          required_repair: ""
  allowed_values:
    sentence_anchor_final_audit.overall_status:
      - "passed"
      - "blocked"
    sentence_results.initial_anchor_status:
      - "strong_anchor"
      - "acceptable_anchor"
      - "weak_anchor"
      - "failed_anchor"
    sentence_results.final_anchor_status:
      - "strong_anchor"
      - "acceptable_anchor"
      - "weak_anchor"
      - "failed_anchor"
    sentence_results.operation_match:
      - "exact"
      - "close"
      - "partial"
      - "no"
    sentence_results.narrative_action_match:
      - "exact"
      - "close"
      - "loose"
      - "mismatch"
    sentence_results.entity_action_role_match:
      - "exact"
      - "close"
      - "loose"
      - "mismatch"
    sentence_results.prewriting_form_match_status:
      - "strong_form_match"
      - "acceptable_form_match"
      - "weak_form_match"
      - "failed_form_match"
      - "missing"
  must_not:
    - "Do not approve based only on punctuation, length, or broad clause count."
    - "Do not approve if narrative_action_match or entity_action_role_match is loose or mismatch."
    - "Do not approve action fit by broad analogy."
    - "Do not pass weak_anchor or failed_anchor into final.anchor.lock.yaml."
    - "Do not pass if formal_match_checks are missing or show unlicensed mismatches."
