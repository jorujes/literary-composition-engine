schema_contract:
  artifact: "runs/<author>/<run_id>/paragraphs/<pid>/source_sentence_anchor.selection.yaml"
  phase: "phase_4_writing_runtime"
  purpose: "Select one real source sentence as the formal machine for each planned target sentence."
  required_top_level:
    - "source_sentence_anchor_selection"
    - "source_to_target_alignment_plan"
  schema:
    source_sentence_anchor_selection:
      paragraph_id: ""
      planned_sentences:
        - sentence_id: ""
          semantic_payload_ref: ""
          target_semantic_job: ""
          matching_ref: "sentence_anchor.matching.yaml#/sentence_anchor_matching/sentences/0"
          selected_form_match_status: "strong_form_match | acceptable_form_match"
          target_form_requirements:
            required_mood: ""
            required_clause_sequence:
              - ""
            required_coordination_or_subordination:
              - ""
            required_turn_logic: ""
            required_punctuation_function: ""
            required_category_of_movement: ""
          selected_source_form_analysis:
            mood: ""
            clause_sequence:
              - ""
            coordination_or_subordination:
              - ""
            turn_logic: ""
            punctuation_function: ""
            category_of_movement: ""
          acceptable_differences_from_source_form:
            - ""
          selected_source_sentence_ref:
            story_id: ""
            sentence_id: null
            paragraph_position: null
            sentence_position: null
            source_text_hash: ""
          selected_source_sentence_text: ""
          candidate_source_sentences_considered:
            - source_sentence_ref: {}
              source_sentence_text: ""
              useful_formal_features_in_this_exact_sentence:
                - ""
              form_match_status: "strong_form_match | acceptable_form_match | weak_form_match | failed_form_match"
              rejection_reason: ""
          source_sentence_parts:
            - part_id: "src_001"
              source_words_or_span: "" # literal source words, not a generic label
              formal_job: ""
          target_payload_slots:
            - slot_id: "tgt_001"
              planned_content: ""
              must_fit_source_part: "src_001"
          why_this_exact_sentence_is_necessary: ""
    source_to_target_alignment_plan:
      - alignment_ref: ""
        sentence_id: ""
        source_sentence_ref: {}
        source_sentence_text: ""
        target_semantic_job: ""
        source_to_target_part_map:
          - source_words_or_span: ""
            source_formal_job: ""
            target_planned_content: ""
            target_formal_job: ""
        must_preserve_from_source_form:
          - ""
        must_not_copy_from_source_semantics:
          - ""
  must_not:
    - "Do not use sentence_pattern ids, skeletons, or extracted pattern descriptions."
    - "Do not record fewer than five candidate source sentences considered when corpus size permits."
    - "Do not choose source sentences sequentially without local necessity."
    - "Do not copy source content, images, names, conclusions, or memorable phrasing."
    - "Do not select a source sentence without a prior strong_form_match or acceptable_form_match in sentence_anchor.matching.yaml."
    - "Do not use generic source spans such as opening syntax, main clause, qualification, or development without literal source words."
    - "Do not use boilerplate reasons such as same local machine, controlled expansion, literal pressure, or narrowed implication without exact source words."
    - "Do not mark a source strong when dialect/register, question/declaration force, object/action category, or sentence length is plainly mismatched."
  must:
    - "why_this_exact_sentence_is_necessary cites a literal span from selected_source_sentence_text."
    - "Every source_sentence_parts.source_words_or_span is a contiguous literal span from selected_source_sentence_text."
    - "source_to_target_part_map.source_words_or_span is a contiguous literal span from source_sentence_text."
    - "If the same target could be justified by many unrelated source sentences, selected_form_match_status must be weak_form_match or failed_form_match and the sentence must be replanned."
